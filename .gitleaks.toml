# gitleaks config for the Wiki publication repo (public knowledge-system machinery).
# Operator-specific PII rules loaded from .gitleaks-operator-rules.toml — the
# token stays relative (an absolute path in a repo config isn't portable
# across machines with different homes). dotty's hooks (rev >= v2026.09.03,
# already pinned here) resolve this relative extend to the fixed installed
# path (~/.config/gitleaks/operator-rules.toml) at hook-run time — no
# gitignored symlink needed in this checkout.

title = "Wiki gitleaks config"

[extend]
path = ".gitleaks-operator-rules.toml"

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''instance\.sample\.md$''',
  '''LICENSE$''',
]
