# gitleaks config for the Wiki repo's CI pipeline ONLY — public-repo-safe.
#
# CI runs in a public GitHub Actions environment: fork PRs never receive
# secrets, and log/match context is visible to anyone who can view the repo.
# The operator's PII-derived rules (`.gitleaks-operator-rules.toml`, a
# gitignored local symlink) must never run here — that would itself be a
# leak surface. This config extends ONLY gitleaks' own built-in default
# ruleset (provider-shaped secrets: AWS keys, API tokens, private keys,
# etc.). The local pre-push hook keeps scanning with the full operator-rules
# chain via `.gitleaks.toml` — that hook remains the authoritative PII
# choke; CI is deliberately the redacted, base-rules floor.
#
# Decision record: LEX-695 comment thread (design input relayed to LEX-703,
# which owns the general fixed-path question for private repos).

title = "Wiki CI gitleaks config (base rules only, no operator PII)"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''\.gitleaks\.ci\.toml$''',
  '''CLAUDE\.sample\.md$''',
  '''LICENSE$''',
]
