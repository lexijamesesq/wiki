name: CI
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: Wiki
          fetch-depth: 0

      # PENDING (LEX-709): stub — dotty PR #168 (composite gitleaks-install
      # action + CI hardening, https://github.com/lexijamesesq/dotty/pull/168)
      # is open and green but not yet merged. Once it merges, replace this
      # `ref:` with that merge commit's full SHA (never a pre-merge branch
      # tip — a squash-merge produces a different commit than any branch
      # commit, and a deleted branch's commits can become unreachable).
      # house-qa's qa.py lives only in dotty, not Wiki itself.
      - name: Checkout dotty (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lexijamesesq/dotty
          ref: PENDING_DOTTY_PR_168_MERGE_SHA
          path: dotty

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run lint-knowledge tests
        run: python3 Wiki/claude/skills/lint-knowledge/tests/run_tests.py

      # house-qa check runs over the whole claude/skills tree for full
      # reporting, but only FAILS the gate on findings in files this PR
      # actually touches — mirroring /publish's own established pattern
      # (gate-mechanical.sh Step 3: diff-scoped, never blocks on legacy
      # debt it didn't introduce) and its tests/fixtures exemption (test
      # fixture data isn't authored artifact content). See LEX-695's
      # decision record for the pre-existing-debt count this was calibrated
      # against.
      - name: house-qa check (claude/skills, gated on changed files)
        run: |
          # qa.py's roster-name-leak check fails loud without a rosters file
          # at Wiki/spec/tag-taxonomy-rosters.md. The real one is real-PII
          # roster data and gitignored — it never exists in this checkout.
          # This placeholder carries zero real names; roster-name-leak in CI
          # can only ever catch its own synthetic tokens, never a real leak.
          # See Wiki/spec/tag-taxonomy-rosters.ci-placeholder.md's own header.
          cp Wiki/spec/tag-taxonomy-rosters.ci-placeholder.md Wiki/spec/tag-taxonomy-rosters.md
          python3 dotty/.claude/skills/house-qa/qa.py Wiki/claude/skills \
            --git-tracked-only --vault-root "$GITHUB_WORKSPACE" --json \
            > house-qa-report.json
          python3 - <<'PYEOF'
          import json
          import subprocess
          import sys
          from pathlib import Path

          report = json.load(open("house-qa-report.json"))
          findings = report.get("findings", [])
          for f in findings:
              print(f"{f['severity']} {f['check']} {f['file']}: {f['detail'][:160]}")

          base_sha = "${{ github.event.pull_request.base.sha }}"
          head_sha = "${{ github.sha }}"
          changed = subprocess.run(
              ["git", "-C", "Wiki", "diff", "--name-only", base_sha, head_sha],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          wiki_root = Path("Wiki").resolve()
          changed_abs = {str((wiki_root / c).resolve()) for c in changed}

          blocking = [
              f for f in findings
              if "/tests/fixtures/" not in f["file"]
              and str(Path(f["file"]).resolve()) in changed_abs
          ]
          if blocking:
              print("::error::house-qa findings in files this PR changed:")
              for f in blocking:
                  print(f"  {f['severity']} {f['check']} {f['file']}: {f['detail'][:160]}")
              sys.exit(1)
          PYEOF

      # Composite action from dotty (see the stubbed checkout above) —
      # de-duplicates the curl+checksum+sha256sum install that used to be
      # written out here verbatim (LEX-709). Base/public-safe rules only —
      # see .gitleaks.ci.toml's own header for why this never extends the
      # operator's PII rules in CI.
      - name: Setup gitleaks
        uses: ./dotty/.github/actions/setup-gitleaks
        with:
          version: '8.30.1'

      - name: Gitleaks scan (base rules, this PR's commits)
        working-directory: Wiki
        run: |
          gitleaks detect --source . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            --config .gitleaks.ci.toml \
            --no-banner --redact --ignore-gitleaks-allow
