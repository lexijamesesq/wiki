name: CI
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: Wiki
          fetch-depth: 0

      # Pinned to dotty PR #168's merge commit (composite gitleaks-install
      # action + CI hardening, https://github.com/lexijamesesq/dotty/pull/168,
      # merged 2026-09-02) — never a floating tag or branch tip. Only the
      # setup-gitleaks composite is consumed from this checkout now.
      - name: Checkout dotty (pinned, for the setup-gitleaks composite)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lexijamesesq/dotty
          ref: 1fe38aab22976e13e3361ac363fd7dd23e68eea2 # PR #168 merge commit
          path: dotty

      # house-qa's qa.py ships in the work-lifecycle plugin repo (its dotty
      # copy is retired by the harness cutover). Pinned to a main commit, never
      # a branch tip; bump the SHA deliberately when qa.py changes.
      - name: Checkout work-lifecycle (pinned, for house-qa's qa.py)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lexijamesesq/work-lifecycle
          ref: dd06aa58c8c007ef4229d62d0b976162c62a902f # main, 2026-09-03
          path: work-lifecycle

      # This repo root is the `wiki` plugin (marketplace + plugin manifest under
      # .claude-plugin/, skills served from .claude/skills via the manifest's
      # `skills` field). --strict turns manifest warnings into failures.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: claude plugin validate --strict
        working-directory: Wiki
        run: claude plugin validate --strict .

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run lint-knowledge tests
        run: python3 Wiki/.claude/skills/lint-knowledge/tests/run_tests.py

      # house-qa check runs over the whole .claude/skills tree for full
      # reporting, but only FAILS the gate on HIGH findings in files this
      # PR actually touches — mirroring /publish's own documented house-qa
      # mechanical rule ("Zero HIGH, excluding tests/fixtures/") and its
      # diff-scoped, don't-block-on-legacy-debt pattern (gate-mechanical.sh
      # Step 3). WARNING/MEDIUM/INFO findings still print in full above,
      # they just don't gate — touching a file at all (even one unrelated
      # line) must not force fixing every pre-existing lower-severity
      # finding in it. See the estate's Decisions record for the
      # pre-existing-debt count this was calibrated against.
      - name: house-qa check (.claude/skills, gated on genuinely-touched files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # qa.py's roster-name-leak check fails loud without a rosters file
          # at Wiki/spec/tag-taxonomy-rosters.md. The real one is real-PII
          # roster data and gitignored — it never exists in this checkout.
          # This placeholder carries zero real names; roster-name-leak in CI
          # can only ever catch its own synthetic tokens, never a real leak.
          # See Wiki/spec/tag-taxonomy-rosters.ci-placeholder.md's own header.
          cp Wiki/spec/tag-taxonomy-rosters.ci-placeholder.md Wiki/spec/tag-taxonomy-rosters.md
          python3 work-lifecycle/plugins/work-lifecycle/skills/house-qa/qa.py Wiki/.claude/skills \
            --git-tracked-only --vault-root "$GITHUB_WORKSPACE" --json \
            > house-qa-report.json
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          report = json.load(open("house-qa-report.json"))
          findings = report.get("findings", [])
          for f in findings:
              print(f"{f['severity']} {f['check']} {f['file']}: {f['detail'][:160]}")

          # A whole-directory rename (e.g. claude/ -> .claude/) makes EVERY
          # file's path change, so any diff scoped by path alone (including
          # tj-actions/changed-files' default all_changed_files output, which
          # does not distinguish a pure rename from real content edits) would
          # list the entire pre-existing tree as "changed" — defeating the
          # whole point of gating on this PR's own content. git's own rename
          # detection is the source of truth that actually separates "this
          # path moved, nothing else" from "this file's content changed" —
          # but the threshold flag needs the %-suffixed form: -M100 alone is
          # NOT "100%", it's git's internal fractional scale (close to a 10%
          # threshold); -M100% asks for exact-similarity-only detection, and
          # under it R100 means the two blobs are byte-identical (mode
          # changes excepted) — a reordered-lines-only rename does NOT
          # report R100 here, it reports as a separate add+delete pair
          # instead (unlike the bare -M100 form, which scores by
          # line-multiset similarity and could call that "identical" too).
          # R100 is excluded from the blocking set below; anything else (A,
          # M, or a rename under 100% similarity) still gates.
          diff = subprocess.run(
              ["git", "-C", "Wiki", "diff", "--name-status", "-M100%",
               "--diff-filter=d", f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"],
              capture_output=True, text=True, check=True,
          ).stdout
          wiki_root = Path("Wiki").resolve()
          touched_abs = set()
          for line in diff.splitlines():
              if not line.strip():
                  continue
              parts = line.split("\t")
              status, paths = parts[0], parts[1:]
              # A file moving OUT of an exempt directory (tests/fixtures/ or
              # reference/, both per qa.py's own exemption logic) must still
              # be scanned even if R100 — the exemption depends on PATH, not
              # content, so a pure rename crossing that boundary needs
              # re-evaluating under its new path.
              old_path_abs = str((wiki_root / paths[0]).resolve())
              exempt_old = "/tests/fixtures/" in old_path_abs or "/reference/" in old_path_abs
              if status.startswith("R100") and not exempt_old:
                  continue
              touched_abs.add(str((wiki_root / paths[-1]).resolve()))

          blocking = [
              f for f in findings
              if f["severity"] == "HIGH"
              and "/tests/fixtures/" not in f["file"]
              and str(Path(f["file"]).resolve()) in touched_abs
          ]
          if blocking:
              print("::error::house-qa findings in files this PR genuinely touched:")
              for f in blocking:
                  print(f"  {f['severity']} {f['check']} {f['file']}: {f['detail'][:160]}")
              sys.exit(1)
          PYEOF

      # Composite action from dotty (see the stubbed checkout above) —
      # de-duplicates the curl+checksum+sha256sum install that used to be
      # written out here verbatim. Base/public-safe rules only —
      # see .gitleaks.ci.toml's own header for why this never extends the
      # operator's PII rules in CI.
      - name: Setup gitleaks
        uses: ./dotty/.github/actions/setup-gitleaks
        with:
          version: '8.30.1'

      - name: Gitleaks scan (base rules, this PR's commits)
        working-directory: Wiki
        run: |
          gitleaks detect --source . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            --config .gitleaks.ci.toml \
            --no-banner --redact --ignore-gitleaks-allow

  release-check:
    # PR-time check, no writes. Required by this repo's branch-protection
    # ruleset (appended alongside this job, strict). Independent of `gate`
    # — a separate job, not touching gate's own trigger or BASE_SHA
    # scoping. Deliberately no `paths:` filter on the workflow — a
    # path-skipped required check stays "Pending" forever and blocks
    # every PR (GitHub docs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: Wiki
          fetch-depth: 0
          fetch-tags: true

      # check-plugin-version.sh lives in work-lifecycle, same pin
      # convention this file already uses for qa.py.
      - name: Checkout work-lifecycle (pinned, for the release scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lexijamesesq/work-lifecycle
          ref: da3609c4bd67f830eb4f9a278c48f3010c9683a4 # main, 2026-09-04
          path: work-lifecycle

      - name: Check plugin version discipline
        working-directory: Wiki
        run: bash ../work-lifecycle/.github/scripts/check-plugin-version.sh . wiki
