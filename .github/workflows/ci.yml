name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1

  all-checks-passed:
    needs: [floor, gate, release-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded (a job skipped on a mechanical PR is satisfied)
        env:
          RESULTS: ${{ toJSON(needs) }}
          MECHANICAL: ${{ needs.floor.outputs.mechanical }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A skipped job is satisfied on a mechanical PR (the floor skipped
          # it) and on any non-PR event (a push to the default branch, where
          # any job skipped by its own `if:` is not a PR's failure); on a
          # functional PR a skipped job is a failure.
          bad="$(jq -r --arg mech "$MECHANICAL" --arg event "$EVENT" '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.value.result == "skipped" and $mech != "true" and $event == "pull_request"))
            | .key' <<<"$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "required job(s) not satisfied: $bad"
            exit 1
          fi
          echo "all checks passed (event=${EVENT} mechanical=${MECHANICAL:-false})"

  gate:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Wiki
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Claude Code CLI 2.1.259
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: claude plugin validate --strict
        working-directory: Wiki
        run: claude plugin validate --strict .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run lint-knowledge tests
        run: python3 Wiki/.claude/skills/lint-knowledge/tests/run_tests.py

  release-check:
    # floor: always-run
    # release-check refuses a plugin change without a version bump;
    # a mechanical PR (a Renovate bump inside a plugin) can still need one.
    # PR-time check, no writes. Required by this repo's branch-protection
    # ruleset (appended alongside this job, strict). Independent of `gate`
    # — a separate job, not touching gate's own trigger or BASE_SHA
    # scoping. Deliberately no `paths:` filter on the workflow — a
    # path-skipped required check stays "Pending" forever and blocks
    # every PR (GitHub docs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Wiki
          fetch-depth: 0
          fetch-tags: true

      # check-plugin-version.sh lives in core-skills (checked out under the
      # legacy `work-lifecycle` local path name; see its own repo for the
      # actual location).
      - name: Checkout work-lifecycle (pinned, for the release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/core-skills
          # Bumped for the estate lint-config rollout: this pin must carry the
          # exclusion for every root config the suite adds (.yamllint.yaml,
          # .markdownlint.yaml, and now ruff.toml), or release-check reads them
          # as plugin content and fails — the same class of miss renovate.json hit.
          ref: a5bc683d8bc5f963b02b6b0f4411682c4bade159 # core-skills#97 merge commit -- adds ruff.toml to the plugin-version exclude list
          path: work-lifecycle

      - name: Check plugin version discipline
        working-directory: Wiki
        run: bash ../work-lifecycle/.github/scripts/check-plugin-version.sh . wiki
